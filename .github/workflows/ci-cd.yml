name: Serverless Data Pipeline CI/CD

# Menentukan kapan pipeline ini berjalan (saat push atau pull request ke branch main/master)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ------------------------------------------------------------------------------
  # JOB 1: PENGECEKAN KUALITAS KODE (PYTHON LINTING & TERRAFORM VALIDATION)
  # ------------------------------------------------------------------------------
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      # Step 1: Mengambil kode dari repositori GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Menyiapkan environment Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Menginstal tool linter (Flake8)
      - name: Install Python Dependencies & Linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      # Step 4: Mengecek kesalahan sintaks pada kode Python
      - name: Lint Kode Python (FastAPI & Lambda)
        run: |
          # Berhenti jika ada error sintaks berat (E9, F63, F7, F82)
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Pengecekan standar kerapian kode
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Step 5: Menyiapkan CLI Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 6: Validasi format dan sintaks file Terraform
      - name: Validate Terraform Code
        run: |
          cd terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

  # ------------------------------------------------------------------------------
  # JOB 2: PENGECEKAN KERENTANAN KEAMANAN (TRIVY SECURITY SCAN)
  # ------------------------------------------------------------------------------
  security-scan:
    name: Security & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: code-quality # Hanya berjalan jika Job 1 (code-quality) berhasil

    steps:
      # Step 1: Mengambil kode dari repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Scan repositori & file Terraform menggunakan Trivy
      - name: Scan Filesystem & Terraform dengan Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0' # Menampilkan laporan tanpa membatalkan build
          severity: 'HIGH,CRITICAL'

      # Step 3: Membuat Docker Image Upload API
      - name: Build Docker Image
        run: |
          docker build -t upload-api:latest src/api/

      # Step 4: Scan Docker Image dari vulnerability menggunakan Trivy
      - name: Scan Docker Image dengan Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'upload-api:latest'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
