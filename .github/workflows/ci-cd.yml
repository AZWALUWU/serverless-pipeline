name: Serverless Data Pipeline CI/CD

# Defines when this pipeline runs (on push or pull request to main/master branches)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # JOB 1: CODE QUALITY CHECK (PYTHON LINTING & TERRAFORM VALIDATION)
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.10 environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install linter tool (Flake8)
      - name: Install Python Dependencies & Linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      # Step 4: Check Python code for syntax errors
      - name: Lint Python Code (FastAPI & Lambda)
        run: |
          # Stop build if there are critical syntax errors (E9, F63, F7, F82)
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Standard code formatting check
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Step 5: Set up Terraform CLI
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 6: Validate Terraform file syntax and format
      - name: Validate Terraform Code
        run: |
          cd terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

  # JOB 2: SECURITY VULNERABILITY CHECK (TRIVY SECURITY SCAN)
  security-scan:
    name: Security & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: code-quality # Only runs if Job 1 (code-quality) succeeds

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Scan repository & Terraform files using Trivy
      - name: Scan Filesystem & Terraform with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0' # Displays report without failing the build
          severity: 'HIGH,CRITICAL'

      # Step 3: Build Upload API Docker Image
      - name: Build Docker Image
        run: |
          docker build -t upload-api:latest src/api/

      # Step 4: Scan Docker Image for vulnerabilities using Trivy
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'upload-api:latest'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'