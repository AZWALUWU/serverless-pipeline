services:
  localstack:
    image: localstack/localstack:4.5.0
    container_name: localstack_main

    ports:
      - "4566:4566"

    environment:
      - DEBUG=0
      - PERSISTENCE=1

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./volume:/var/lib/docker/localstack/_data"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
